services:
  # =========================================================================
  # 1. FastAPI Backend Web Service (Free Tier)
  # Embeds both the API and the Ingestion Worker in a single 100% Free container
  # =========================================================================
  - type: web
    name: enterprise-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-rag-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ACTIVE_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: ACTIVE_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LANGFUSE_ENABLED
        value: "false"

databases:
  # =========================================================================
  # 2. PostgreSQL Managed Database (Free Tier)
  # =========================================================================
  - name: enterprise-rag-db
    databaseName: enterprise_rag
    user: enterprise_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
