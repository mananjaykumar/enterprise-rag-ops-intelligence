name: Enterprise Platform CI/CD Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-test-evaluate:
    name: Lint, Test & Evaluation Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Application & Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Gate 1A - Ruff Linting Check
        run: |
          ruff check .

      - name: Gate 1B - Ruff Formatting Check
        run: |
          ruff format --check .

      - name: Gate 2 & 3 - Run Unit Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/enterprise_rag
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ci-test-secret-key-32-chars-long-production-grade
          ENVIRONMENT: testing
          LANGFUSE_ENABLED: "false"
        run: |
          pytest tests/unit/ -v

      - name: Gate 4 - Run Evaluation Benchmark Quality Gate
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/enterprise_rag
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ci-test-secret-key-32-chars-long-production-grade
          ENVIRONMENT: testing
          LANGFUSE_ENABLED: "false"
        run: |
          python scripts/run_evaluation.py

  docker-build-verification:
    name: Multi-Stage Container Build Verification
    needs: lint-test-evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Gate 5 - Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-rag-intelligence:latest
