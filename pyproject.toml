[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "google-genai>=0.1.1",
    "sqlglot>=23.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "flashrank>=0.2.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
# Target Python version
target-version = "py312"
line-length = 100

# Files and directories to exclude
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "frontend",
    "node_modules",
    ".next",
]

[tool.ruff.lint]
# E/W: Pycodestyle, F: Pyflakes, I: isort (import sorting), B: flake8-bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # Line length handled automatically by the formatter

[tool.ruff.format]
# Use double quotes for strings (standard Python convention)
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"

